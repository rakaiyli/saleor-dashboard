name: Build dashboard image

# 手动触发：Actions 页面 -> Build dashboard image -> Run workflow
# 也可打 tag 触发（push v*）
on:
  workflow_dispatch:
    inputs:
      locale_code:
        description: "默认语言：TS 枚举名，不是 BCP47 标签（简中=ZH_HANS）"
        required: true
        default: "ZH_HANS"
        type: choice
        options:
          - ZH_HANS
          - ZH_HANT
          - EN
      platforms:
        description: "目标架构"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
  push:
    tags:
      - "v*"

env:
  # GHCR 要求镜像路径全小写（GitHub 用户名 RaKaiYli 含大写，必须写成 rakaikyli）
  IMAGE: ghcr.io/rakaikyli/saleor-dashboard

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            LOCALE_CODE=${{ inputs.locale_code || 'ZH_HANS' }}
            SKIP_SOURCEMAPS=true
            COMMIT_ID=${{ github.sha }}
            PROJECT_VERSION=${{ github.ref_name }}
          # pnpm install 层很大，缓存能省掉大部分时间
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show result
        run: |
          echo "Image: ${{ env.IMAGE }}:latest"
          echo "Digest: ${{ steps.build.outputs.digest }}"
